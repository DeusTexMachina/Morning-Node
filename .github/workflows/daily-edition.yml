name: Print Daily Edition

on:
  schedule:
    - cron: '0 11 * * *' # 6:00 AM CT
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live News & Generate JSON
        run: node fetch-news.mjs

      - name: Commit & Push Daily Edition
        run: |
          git config --global user.name "Morning Node Press"
          git config --global user.email "bot@github.com"
          git add news-data.json
          git commit -m "🗞️ Daily Edition: $(date +'%Y-%m-%d')" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
